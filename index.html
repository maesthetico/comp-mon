            height: 100vh;
        }
        #map {
            flex: 2;
            height: 100%;
        }
        .sidebar {
            flex: 1;
            padding: 20px;
            background-color: #fff;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.8em;
        }
        h2 {
            color: #3498db;
            font-size: 1.4em;
            margin-top: 20px;
        }
        .object-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .object-item {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .object-item:hover {
            background-color: #d6eaf8;
        }
        .object-item.active {
            background-color: #3498db;
            color: white;
        }
        .tabs {
            display: flex;
            margin-top: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-bottom: none;
            margin-right: 5px;
            border-radius: 4px 4px 0 0;
        }
        .tab.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        .tab-content {
            display: none;
            padding: 15px;
            border: 1px solid #ddd;
            border-top: none;
            background-color: #fff;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .legend {
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            line-height: 24px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
        .info-table {
            width: 100%;
            margin-top: 10px;
        }
        .info-table th {
            width: 40%;
            background-color: #f2f2f2;
            padding: 5px;
            text-align: left;
        }
        .info-table td {
            padding: 5px;
        }
        .chart-container {
            width: 100%;
            height: 300px;
            margin-top: 15px;
        }
        .filter-panel {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

</head>

            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: ${getMarkerColor(subsystem)}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;"></div>`,
                iconSize: [15, 15],
                iconAnchor: [7, 7]
            });
        }
        
        let markers = [];
        objects.forEach(obj => {
            const marker = L.marker(obj.coordinates, {
                icon: createMarkerIcon(obj.subsystem)
            }).addTo(map);
            
            marker.bindTooltip(obj.name);
            marker.objectId = obj.id;
            
            marker.on('click', function() {
                showObjectDetails(obj.id);
            });
            
            markers.push(marker);
        });
        
        function renderObjectList(filter = 'all') {
            const objectList = document.getElementById('object-list');
            objectList.innerHTML = '';
            
            objects.forEach(obj => {
                if (filter === 'all' || obj.subsystem === filter) {
                    const li = document.createElement('li');
                    li.className = 'object-item';
                    li.textContent = obj.name;
                    li.setAttribute('data-id', obj.id);
                    
                    li.addEventListener('click', function() {
                        showObjectDetails(obj.id);
                    });
                    
                    objectList.appendChild(li);
                }
            });
        }
        
        document.getElementById('subsystem-filter').addEventListener('change', function() {
            const filter = this.value;
            renderObjectList(filter);
            
            markers.forEach((marker, index) => {
                const obj = objects[index];
                if (filter === 'all' || obj.subsystem === filter) {
                    marker.addTo(map);
                } else {
                    marker.remove();
                }
            });
        });
        
        function showObjectDetails(objectId) {
            const obj = objects.find(o => o.id === Number(objectId));
            if (!obj) return;

            document.querySelectorAll('.object-item').forEach(item => {
                item.classList.remove('active');
                if (Number(item.getAttribute('data-id')) === obj.id) {
                    item.classList.add('active');
                }
            });

            document.querySelector('#passport-table tr:nth-child(1) td').textContent = obj.name;
            document.querySelector('#passport-table tr:nth-child(2) td').textContent = obj.identifier;
            document.querySelector('#passport-table tr:nth-child(3) td').textContent = obj.address;
            document.querySelector('#passport-table tr:nth-child(4) td').textContent = `${obj.coordinates[0]}, ${obj.coordinates[1]}`;
            
            const subsystemNames = {
                'air': 'Моніторинг повітря',
                'water': 'Моніторинг води',
                'soil': 'Моніторинг ґрунтів',
                'radiation': 'Моніторинг радіації',
                'economic': 'Економічний моніторинг',
                'energy': 'Енергетичний моніторинг',
                'health': 'Моніторинг здоров\'я'
            };
            
            document.querySelector('#passport-table tr:nth-child(5) td').textContent = subsystemNames[obj.subsystem] || '-';
            
            const paramsTable = document.getElementById('parameters-table').querySelector('tbody');
            paramsTable.innerHTML = '';
            
            obj.parameters.forEach(param => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${param.name}</td>
                    <td>${param.value}</td>
                    <td>${param.unit}</td>
                `;
                paramsTable.appendChild(row);
            });
            
            map.setView(obj.coordinates, 14);
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabContent = this.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(`${tabContent}-content`).classList.add('active');
            });
        });
        
        renderObjectList();
        
        function getSubsystemName(subsystem) {
            const subsystemNames = {
                'air': 'Моніторинг повітря',
                'water': 'Моніторинг води',
                'soil': 'Моніторинг ґрунтів',
                'radiation': 'Моніторинг радіації',
                'economic': 'Економічний моніторинг',
                'energy': 'Енергетичний моніторинг',
                'health': 'Моніторинг здоров\'я'
            };
            
            return subsystemNames[subsystem] || 'Невідома підсистема';
        }
    </script>
</body>
</html>
